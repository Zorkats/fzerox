  offset: 0x2738A0  # PORT_podium_gfx_ROM_START
  size: 0xF50       # 0x2747F0 - 0x2738A0 (compressed MIO0 ROM span)

# --- Sparse indexed families (C-R1.8): whole contiguous range in one blob ---
# super_textures: consumers slice at D_800CD220[venue]*0x800 inside this span.
super_textures:
  type: BLOB
  offset: 0x2747F0  # PORT_super_textures_ROM_START
  size: 0x4000      # 0x2787F0 - 0x2747F0 (full indexed-table span)

# course_data: consumers slice at courseIndex*sizeof(CourseData). sizeof(CourseData)=0x7E0
# (decomp/include/fzx_course.h:34), 26 courses -> 26*0x7E0 = 0xCCC0, matching the ROM span.
course_data:
  type: BLOB
  offset: 0x2AD1E0  # PORT_course_data_ROM_START
  size: 0xCCC0      # 0x2B9EA0 - 0x2AD1E0 = 26 * 0x7E0

# --- R4 additions (W-R4.S1 census): raw ROM-slice blobs joining the SAME
# shared containment-lookup table (sSegmentBlobMap / gdx_lookup_segment_blob)
# as the families above. Offsets/sizes verified against
# decomp/include/port_segment_addrs.h and the named constants below.

# common_assets_compressed: full raw span of the 1028 back-to-back MIO0
# sub-asset payloads (decomp/assets/yaml/us/rev0/common_assets_compressed.yaml
# defines each individual sub-asset symbol + its ROM offset, feeding the
# SEPARATE sCommonAssetRomMap lookup used by func_80077CF0/object.c). This
# entry makes the WHOLE span byte-servable from the archive as one blob;
# consumers still carve individual sub-asset ranges out of it via the
# sCommonAssetRomMap offsets, resolved through this shim's containment lookup.
common_assets_compressed:
  type: BLOB
  offset: 0x2B9EA0  # PORT_common_assets_compressed_ROM_START
  size: 0x26AA80    # 0x524920 - 0x2B9EA0 (PORT_common_assets_compressed_ROM_END)

# kanji_tables: covers GDX_ROM_KANJI_INDEX_TBL (port/n64_leo.c:290 --
# s16[1316] = 0xA48 bytes, ROM 0x80960..0x813A8) through the end of
# GDX_ROM_ANK_METRICS_TBL (port/n64_leo.c:291 -- 4 bytes * 0x908 entries =
# 0x2420 bytes, ROM 0x8142C..0x8384C) as ONE slice, including the 0x84-byte
# gap between the two tables (0x813A8..0x8142C). Read by
# LeoGetKAdr/LeoGetAAdr (port/n64_leo.c:297-353).
kanji_tables:
  type: BLOB
  offset: 0x80960   # GDX_ROM_KANJI_INDEX_TBL
  size: 0x2EEC      # 0x8384C - 0x80960 (0x8142C + 0x908*4 = ANK table end)

# rom_boot_tuning: generous page covering the ROM_READ(...) literal offsets
# used by Racer_InitMachineStats (decomp/src/game/racer.c) and peers
# (decomp/src/overlays/ovl_i9/machine_draw.c:4955,
# decomp/src/overlays/ovl_i6/E7CF0.c:12). Observed literal offsets span
# [0x078, 0xA20], each a 4-byte ROM_READ, so the accessed byte range is
# [0x78, 0xA24). One page (0x1000) covers it with headroom.
rom_boot_tuning:
  type: BLOB
  offset: 0x0
  size: 0x1000
