# segment_blob.yaml — R1 venue/geometry raw-blob recipe (contract R1_CONTRACTS.md C-R1.1/C-R1.2)
#
# One `type: BLOB` entry per family, each a byte-exact ROM slice delivered verbatim.
#
# There is intentionally NO `:config: segments:` block. Companion::ProcessFile resets the
# per-file compression context to CompressionType::None (torch Companion.cpp:687), and with no
# segments block nothing sets it otherwise, so Decompressor::AutoDecode takes the None path and
# returns buffer[offset : offset+size] verbatim. MIO0 families (course_track_gfx, machine_models,
# podium_gfx) are therefore stored STILL-COMPRESSED — no `mio0:` key is present, so no decode
# happens. Every consumer keeps its own decode/swap step (mio0_decode, CourseData_FromRom,
# gdx_fixup_asset_segment_image). Correctness is provable by byte-equality against the ROM slice.
#
# Archive keys derive as `segment_blob/<entryName>` (yaml stem / entry key). Only the Binary
# exporter runs under gdx-extract, so the BLOB header/code exporters never touch the build.
#
# All offsets/sizes are ABSOLUTE ROM byte ranges.
# PAL rev0 offsets are the US rev0 offsets shifted by 0x12C50, which matches the relocation
# observed across the entire non-audio asset region. Sizes are preserved because every family
# keeps the same span in the PAL ROM. The kanji_tables region is also shifted by the same amount
# because it lives in the expanded code/data segment; this is a judgment call pending real-ROM
# verification (PAL does not need kanji, but the archive still needs the same key layout).

# --- Beta / creation textures (raw big-endian) ---
expansion_kit_textures_beta:
  type: BLOB
  offset: 0x1587C0  # PORT_expansion_kit_textures_beta_ROM_START (PAL)
  size: 0xDA40      # 0x166200 - 0x1587C0

course_edit_textures_beta:
  type: BLOB
  offset: 0x166200  # PORT_course_edit_textures_beta_ROM_START (PAL)
  size: 0x130B0     # 0x1792B0 - 0x166200

create_machine_textures:
  type: BLOB
  offset: 0x1792B0  # PORT_create_machine_textures_ROM_START (PAL)
  size: 0x6240      # 0x17F8F0 - 0x1792B0

# --- MIO0 geometry/texture families (stored still-compressed, raw ROM span) ---
course_track_gfx:
  type: BLOB
  offset: 0x17F8F0  # PORT_course_track_gfx_ROM_START (PAL)
  size: 0xE940      # 0x18E230 - 0x17F8F0 (compressed ROM span; DECODED_SIZE 0x22500 is NOT the stored size)

# setup_gfx covers the FULL seg-0x03 range [0x18DE30, 0x1CB180) per C-R1.7. The runtime performs
# two separate carves inside this one blob: setup_gfx at +0x0 and machine_custom_gfx at +0x780.
# There is NO separate machine_custom_gfx blob; the shim's containment lookup serves both carves.
setup_gfx:
  type: BLOB
  offset: 0x18DE30  # PORT_setup_gfx_ROM_START (PAL)
  size: 0x3D370     # 0x1CB180 - 0x18DE30 (PORT_setup_gfx_ROM_START .. PORT_hud_gfx_ROM_START)

# --- Raw big-endian gfx families ---
hud_gfx:
  type: BLOB
  offset: 0x1CB180  # PORT_hud_gfx_ROM_START (PAL)
  size: 0x29EA0     # 0x1F5020 - 0x1CB180

machine_global_gfx:
  type: BLOB
  offset: 0x1F5020  # PORT_machine_global_gfx_ROM_START (PAL)
  size: 0x48CB0     # 0x23DCF0 - 0x1F5020

machine_models:
  type: BLOB
  offset: 0x23DCF0  # PORT_machine_models_ROM_START (PAL)
  size: 0xA090      # 0x247D80 - 0x23DCF0 (compressed MIO0 ROM span)

