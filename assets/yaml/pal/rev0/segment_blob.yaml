  size: 0xF50       # 0x287430 - 0x2864E0 (compressed MIO0 ROM span)

# --- Sparse indexed families (C-R1.8): whole contiguous range in one blob ---
# super_textures: consumers slice at D_800CD220[venue]*0x800 inside this span.
super_textures:
  type: BLOB
  offset: 0x287430  # PORT_super_textures_ROM_START (PAL)
  size: 0x4000      # 0x28B430 - 0x287430 (full indexed-table span)

# course_data: consumers slice at courseIndex*sizeof(CourseData). sizeof(CourseData)=0x7E0
# (decomp/include/fzx_course.h:34), 26 courses -> 26*0x7E0 = 0xCCC0, matching the ROM span.
course_data:
  type: BLOB
  offset: 0x2BFE30  # PORT_course_data_ROM_START (PAL)
  size: 0xCCC0      # 0x2CCAF0 - 0x2BFE30 = 26 * 0x7E0

# --- R4 additions (W-R4.S1 census): raw ROM-slice blobs joining the SAME
# shared containment-lookup table (sSegmentBlobMap / gdx_lookup_segment_blob)
# as the families above. Offsets/sizes verified against
# decomp/include/port_segment_addrs.h and the named constants below.

# common_assets_compressed: full raw span of the 1028 back-to-back MIO0
# sub-asset payloads (decomp/assets/yaml/pal/rev0/common_assets_compressed.yaml
# defines each individual sub-asset symbol + its ROM offset, feeding the
# SEPARATE sCommonAssetRomMap lookup used by func_80077CF0/object.c). This
# entry makes the WHOLE span byte-servable from the archive as one blob;
# consumers still carve individual sub-asset ranges out of it via the
# sCommonAssetRomMap offsets, resolved through this shim's containment lookup.
common_assets_compressed:
  type: BLOB
  offset: 0x2CCAF0  # PORT_common_assets_compressed_ROM_START (PAL)
  size: 0x26AA80    # 0x537970 - 0x2CCAF0 (PORT_common_assets_compressed_ROM_END)

# kanji_tables: covers GDX_ROM_KANJI_INDEX_TBL through GDX_ROM_ANK_METRICS_TBL.
# Shifted by the same code-segment delta as other non-audio regions; the exact
# PAL location of these tables has not been verified on hardware.
kanji_tables:
  type: BLOB
  offset: 0x935B0   # US 0x80960 + 0x12C50 (estimated)
  size: 0x2EEC      # same span as US

# rom_boot_tuning: generous page covering the ROM_READ(...) literal offsets
# used by Racer_InitMachineStats and peers. The boot region is not shifted.
rom_boot_tuning:
  type: BLOB
  offset: 0x0
  size: 0x1000
